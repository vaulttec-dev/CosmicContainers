<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Cosmic Containers</title>
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6BF0"/>
      <stop offset="1" stop-color="#2A2F86"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cc-bg)"/>
  <!-- Orbit sits behind the cube: the container is the planet the applet circles. -->
  <ellipse cx="64" cy="70" rx="56" ry="16" fill="none" stroke="#ffffff" stroke-opacity=".55"
           stroke-width="9" transform="rotate(-18 64 70)"/>
  <!-- Isometric cube; the three face opacities carry the volume at any size. -->
  <path d="M64 24 L100 45 L64 66 L28 45 Z" fill="#ffffff"/>
  <path d="M28 45 L64 66 L64 106 L28 85 Z" fill="#ffffff" fill-opacity=".85"/>
  <path d="M100 45 L64 66 L64 106 L100 85 Z" fill="#ffffff" fill-opacity=".6"/>
</svg>
