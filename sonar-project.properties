# Self-hosted SonarQube configuration (scanner runs in .github/workflows/sonarqube.yml)
# Server: https://sonar.195.201.23.232.nip.io (deployment: doc2pay repo, infra/sonarqube)

sonar.projectKey=linux-pop-extension

sonar.sources=.

# Exclude generated, vendored and non-production directories
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/out/**,\
  **/coverage/**,\
  **/target/**,\
  **/.dart_tool/**,\
  **/android/**,\
  **/ios/**,\
  **/macos/**,\
  **/windows/**,\
  **/linux/**,\
  **/web/icons/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.min.js,\
  **/prisma/migrations/**

# Test file patterns
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*_test.dart
